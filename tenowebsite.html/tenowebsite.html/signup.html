<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Teno Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Reuse same styles from login for consistency */
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .bg-blobs {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; z-index: 0;
    }
    .blob {
      position: absolute;
      filter: blur(80px);
      border-radius: 50%;
      opacity: 0.4;
      animation: float 10s infinite alternate ease-in-out;
    }
    .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #6366f1; }
    .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: #a855f7; animation-delay: -5s; }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }
    
    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 2rem;
    }
    .logo span {
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 1.8rem; font-weight: 700; text-align: center; margin-bottom: 0.5rem; }
    p.subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; outline: none; transition: all 0.2s; }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    
    .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-google { background: white; color: #333; margin-bottom: 1rem; }
    .btn-google:hover { background: #f1f5f9; }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider::before { margin-right: 1rem; }
    .divider::after { margin-left: 1rem; }
    
    .footer-links { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .footer-links a:hover { text-decoration: underline; }
    
    #error-msg { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; border: 1px solid rgba(239, 68, 68, 0.2); }
    #success-msg { color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; border: 1px solid rgba(16, 185, 129, 0.2); text-align: center;}
    
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 1.5rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
      line-height: 1;
    }
    .close-btn:hover {
      color: white;
    }
  </style>
</head>
<body>

<div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<div class="auth-container">
  <a href="tenoweb.html" class="close-btn" title="Back to Home">&times;</a>
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><linearGradient id="grad" x1="0" y1="0" x2="100%" y2="100%"><stop stop-color="#818cf8"/><stop stop-color="#c084fc"/></linearGradient><path d="M2 12h4l3-9 5 18 3-9h5"/></svg>
    <span>Teno</span>
  </div>
  
  <h1>Create an Account</h1>
  <p class="subtitle">Start your 14-day free trial</p>

  <button class="btn btn-google" onclick="handleGoogle()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Sign up with Google
  </button>
  
  <div class="divider">OR SIGN UP WITH EMAIL</div>
  
  <div id="error-msg"></div>
  <div id="success-msg">Account created successfully! Redirecting...</div>
  
  <form id="signup-form" novalidate onsubmit="handleSignup(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="fullname" required placeholder="John Doe">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="you@company.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required minlength="6" placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary" id="submit-btn">Sign Up</button>
  </form>
  
  <div class="footer-links">
    Already have an account? <a href="login.html">Log in</a>
  </div>
</div>

<script src="auth.js"></script>
<script>
  Auth.redirectIfAuthenticated();

  async function handleSignup(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    const succEl = document.getElementById('success-msg');
    
    const name = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    errEl.style.display = 'none';

    // Basic validation
    if (!name || !email || !password) {
      errEl.textContent = "Please fill in all fields.";
      errEl.style.display = 'block';
      return;
    }
    if (!email.includes('@')) {
      errEl.textContent = "Please enter a valid email address.";
      errEl.style.display = 'block';
      return;
    }
    if (password.length < 6) {
      errEl.textContent = "Password must be at least 6 characters.";
      errEl.style.display = 'block';
      return;
    }

    btn.textContent = 'Creating account...';
    btn.disabled = true;

    const { data, error } = await Auth.signUp(email, password, name);
    
    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      btn.textContent = 'Sign Up';
      btn.disabled = false;
    } else {
      succEl.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'rfm-analysis.html';
      }, 1500);
    }
  }

  async function handleGoogle() {
    const btn = document.querySelector('.btn-google');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Connecting to Google...';
    btn.disabled = true;

    const { error } = await Auth.signInWithGoogle();
    
    if (error) {
      const errEl = document.getElementById('error-msg');
      errEl.textContent = error.message || "Authentication failed. Check your Supabase keys.";
      errEl.style.display = 'block';
      btn.innerHTML = originalText;
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
